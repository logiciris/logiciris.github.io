title: logiciris
tagline: Offensive Security, Research and Builder.
description: logiciris — 논리로 시스템을 읽고, 취약점을 봅니다. 보안 연구 기록과 개념 노트.
lang: ko-KR
timezone: Asia/Seoul
future: true
url: "https://logiciris.com"
baseurl: ""

author:
  name: logiciris

github_username: logiciris

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed

collections:
  notes:
    output: true
    permalink: /notes/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: notes
    values:
      layout: post
      toc: true
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
