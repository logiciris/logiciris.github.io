title: logiciris
tagline: Offensive Security, Research and Builder.
description: logiciris — 논리로 시스템을 읽고, 취약점을 봅니다. 보안 연구 기록과 개념 노트.
lang: ko-KR
timezone: Asia/Seoul
future: true
url: "https://logiciris.com"
baseurl: ""

author:
  name: logiciris

github_username: logiciris

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed

comments:
  provider: giscus # empty = off. Per-page opt-out: `comments: false` in front matter
  giscus:
    repo: logiciris/logiciris.github.io
    repo_id: MDEwOlJlcG9zaXRvcnkyMTIxMTU5MjE=
    category: General
    category_id: DIC_kwDODKSh0c4CqYR-
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    input_position: bottom
    lang: ko

# Visitor analytics. Empty = off. Emitted only when jekyll.environment == production.
analytics:
  goatcounter: "" # GoatCounter site code (CODE in https://CODE.goatcounter.com)
  google_analytics: "" # GA4 measurement id (G-XXXXXXXXXX)

collections:
  notes:
    output: true
    permalink: /notes/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: notes
    values:
      layout: post
      render_with_liquid: false
      toc: true
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
