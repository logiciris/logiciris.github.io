{%- if jekyll.environment == 'production' -%}
{%- if site.analytics.goatcounter and site.analytics.goatcounter != '' -%}
<script data-goatcounter="https://{{ site.analytics.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{%- endif -%}
{%- if site.analytics.google_analytics and site.analytics.google_analytics != '' -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google_analytics }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.analytics.google_analytics }}');</script>
{%- endif -%}
{%- endif -%}
