{% assign p = page.url %}
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="logiciris 홈">
      {% include logo.html %}<span class="brand-name">logiciris</span>
    </a>
    <nav class="site-nav" aria-label="주 메뉴">
      <a href="{{ '/posts/' | relative_url }}"{% if p contains '/posts/' %} aria-current="page"{% endif %}>Posts</a>
      <a href="{{ '/notes/' | relative_url }}"{% if p contains '/notes/' %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/projects/' | relative_url }}"{% if p contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}"{% if p contains '/about/' %} aria-current="page"{% endif %}>About</a>
      <button type="button" class="search-open" aria-label="검색 (/ 또는 Ctrl/⌘+K)" data-search-open>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button type="button" class="theme-toggle" aria-label="밝은/어두운 테마 전환" data-theme-toggle>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
